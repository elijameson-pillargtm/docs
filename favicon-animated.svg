<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <style>
    @keyframes f1 { 0%,100% { y:19; height:10; } 50% { y:17; height:12; } }
    @keyframes f2 { 0%,100% { y:15; height:14; } 50% { y:12; height:17; } }
    @keyframes f3 { 0%,100% { y:11; height:18; } 50% { y:8; height:21; } }
    @keyframes f4 { 0%,100% { y:7; height:22; } 50% { y:4; height:25; } }
    @keyframes f5 { 0%,100% { y:3; height:26; } 50% { y:1; height:28; } }
    .f1 { animation: f1 3s ease-in-out infinite; }
    .f2 { animation: f2 3s ease-in-out infinite 0.25s; }
    .f3 { animation: f3 3s ease-in-out infinite 0.5s; }
    .f4 { animation: f4 3s ease-in-out infinite 0.75s; }
    .f5 { animation: f5 3s ease-in-out infinite 1s; }
  </style>
  <rect x="0" y="0" width="32" height="2" rx="1" fill="#1E293B"/>
  <rect class="f1" x="2"  y="19" width="4" height="10" fill="#2D5BDA"/>
  <rect class="f2" x="8"  y="15" width="4" height="14" fill="#2D5BDA"/>
  <rect class="f3" x="14" y="11" width="4" height="18" fill="#2D5BDA"/>
  <rect class="f4" x="20" y="7"  width="4" height="22" fill="#2D5BDA"/>
  <rect class="f5" x="26" y="3"  width="4" height="26" fill="#2D5BDA"/>
  <rect x="0" y="30" width="32" height="2" rx="1" fill="#1E293B"/>
</svg>
