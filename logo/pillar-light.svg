<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <style>
    @keyframes b1 { 0%,100% { y:119; height:65; } 50% { y:107; height:77; } }
    @keyframes b2 { 0%,100% { y:95; height:89; } 50% { y:80; height:104; } }
    @keyframes b3 { 0%,100% { y:71; height:113; } 50% { y:53; height:131; } }
    @keyframes b4 { 0%,100% { y:46; height:138; } 50% { y:25; height:159; } }
    @keyframes b5 { 0%,100% { y:22; height:162; } 50% { y:4; height:180; } }
    .b1 { animation: b1 3s ease-in-out infinite; }
    .b2 { animation: b2 3s ease-in-out infinite 0.25s; }
    .b3 { animation: b3 3s ease-in-out infinite 0.5s; }
    .b4 { animation: b4 3s ease-in-out infinite 0.75s; }
    .b5 { animation: b5 3s ease-in-out infinite 1s; }
    @media (prefers-reduced-motion: reduce) {
      .b1,.b2,.b3,.b4,.b5 { animation: none; }
    }
  </style>
  <rect x="0" y="0" width="200" height="16" rx="2.4" fill="#1E293B"/>
  <rect class="b1" x="10"  y="119" width="28" height="65"  fill="#2D5BDA"/>
  <rect class="b2" x="48"  y="95"  width="28" height="89"  fill="#2D5BDA"/>
  <rect class="b3" x="86"  y="71"  width="28" height="113" fill="#2D5BDA"/>
  <rect class="b4" x="124" y="46"  width="28" height="138" fill="#2D5BDA"/>
  <rect class="b5" x="162" y="22"  width="28" height="162" fill="#2D5BDA"/>
  <rect x="0" y="184" width="200" height="16" rx="2.4" fill="#1E293B"/>
</svg>
